<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#3B6D11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PayMeBack" />
    <title>PayMeBack</title>
    <!-- Zet het thema voor de eerste tekening, anders flitst de app wit op bij
         het opstarten in dark mode. Dit moet hier staan en niet in React: de
         bundel laadt pas na deze regel. utils/thema.ts gebruikt dezelfde
         sleutel en dezelfde klassenaam. -->
    <script>
      try {
        var keuze = localStorage.getItem('paymeback:thema')
        var donker =
          keuze === 'donker' ||
          ((keuze === null || keuze === 'systeem') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('donker', donker)
      } catch (e) {
        // Geen toegang tot localStorage: dan gewoon licht.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
